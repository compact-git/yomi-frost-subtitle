<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; script-src 'self'">
<title>Yomi Frost 字幕</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@500;800&family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;user-select:none}
  #stage{position:fixed;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
  #edit{position:fixed;inset:0;display:none;border:4px dashed #ff5fa2;background:rgba(27,16,54,.35);-webkit-app-region:drag;box-sizing:border-box}
  body.editing #edit{display:block}
  #editBar{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#1b1036;color:#fff;border:3px solid #ff5fa2;border-radius:14px;
    padding:8px 14px;font:800 15px "M PLUS Rounded 1c",sans-serif;display:flex;gap:12px;align-items:center;white-space:nowrap}
  #editBar button{-webkit-app-region:no-drag;font:800 14px inherit;font-family:inherit;border:2px solid #fff;border-radius:10px;background:#2fe0b5;color:#1b1036;padding:4px 12px;cursor:pointer}
  #hint{position:fixed;left:10px;bottom:10px;font:800 14px "M PLUS Rounded 1c",sans-serif;color:#fff;background:rgba(27,16,54,.85);
    padding:6px 10px;border-radius:8px;border:2px solid #ff5fa2;transition:opacity .5s}
  #hint.hide{opacity:0}
</style>
</head>
<body>
<div id="stage"></div>
<div id="edit"><div id="editBar">✋ ドラッグで移動・端をつかんでサイズ変更 <button id="done">✔ 調整おわり</button></div></div>
<div id="hint">Yomi Frost 字幕: 起動しました</div>
<script src="subrender.js"></script>
<script src="overlay.js"></script>
</body>
</html>
